<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevToolbox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, #201d16 0%, #14130f 60%, #100f0b 100%);
    color: #e0dccf;
    user-select: none; -webkit-user-select: none;
    cursor: default;
  }
  .glow {
    position: relative;
    width: 104px; height: 104px;
    display: grid; place-items: center;
    animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .glow::before {
    content: ""; position: absolute; inset: -30%;
    background: radial-gradient(circle, rgba(255,140,80,0.35), transparent 68%);
    filter: blur(10px);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .glow img { width: 100px; height: 100px; border-radius: 24px; position: relative; }
  .title {
    font-size: 26px; font-weight: 700; letter-spacing: 0.2px;
    animation: rise 0.6s 0.06s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .sub {
    font-size: 12.5px; color: #928f86; margin-top: -8px;
    animation: rise 0.6s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .bar {
    width: 168px; height: 3px; border-radius: 3px; margin-top: 10px;
    background: rgba(255,255,255,0.08); overflow: hidden; position: relative;
  }
  .bar::after {
    content: ""; position: absolute; top: 0; left: 0; height: 100%; width: 40%;
    border-radius: 3px;
    background: linear-gradient(90deg, #FFC24A, #FF7A47, #FF4D74);
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="glow"><img src="/favicon.svg" alt="" /></div>
  <div class="title">DevToolbox</div>
  <div class="sub">Developer tools &middot; offline &amp; private</div>
  <div class="bar"></div>
</body>
</html>
