<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="960" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC24A"/>
      <stop offset="0.52" stop-color="#FF7A47"/>
      <stop offset="1" stop-color="#FF4D74"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.24" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="470" x2="0" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#43356A"/>
      <stop offset="1" stop-color="#291F45"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="452" x2="0" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#59477F"/>
      <stop offset="1" stop-color="#3E2F62"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="530" x2="0" y2="596" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FFB43D"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- floating shadow -->
  <rect x="248" y="486" width="528" height="322" rx="60" fill="#2A0E22" opacity="0.32" filter="url(#sh)"/>

  <!-- handle -->
  <path d="M404 470 C404 372 436 348 512 348 C588 348 620 372 620 470" fill="none"
        stroke="#2B2047" stroke-width="42" stroke-linecap="round"/>
  <path d="M404 470 C404 372 436 348 512 348 C588 348 620 372 620 470" fill="none"
        stroke="#6B5794" stroke-width="16" stroke-linecap="round" opacity="0.55"/>

  <!-- body -->
  <rect x="248" y="452" width="528" height="326" rx="60" fill="url(#body)"/>
  <!-- lid (rounded top only) -->
  <path d="M308 452 H716 A60 60 0 0 1 776 512 V576 H248 V512 A60 60 0 0 1 308 452 Z" fill="url(#lid)"/>
  <!-- lid gloss -->
  <path d="M320 470 H704 A44 44 0 0 1 720 486 H304 A44 44 0 0 1 320 470 Z" fill="#FFFFFF" opacity="0.12"/>
  <!-- seam shadow -->
  <path d="M256 576 H768" stroke="#1E1636" stroke-width="10" opacity="0.5"/>

  <!-- clasp gem -->
  <rect x="470" y="536" width="84" height="60" rx="18" fill="url(#gem)"/>
  <rect x="470" y="536" width="84" height="26" rx="13" fill="#FFFFFF" opacity="0.25"/>

  <!-- </> dev mark on the body front -->
  <g fill="none" stroke="#D8C8F5" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M476 620 L442 660 L476 700"/>
    <path d="M548 620 L582 660 L548 700"/>
    <path d="M528 606 L496 714" stroke-width="20"/>
  </g>
</svg>
