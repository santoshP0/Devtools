services:
  - type: web
    name: devtoolbox
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA fallback — without this every deep link (/base64, /regex-tester…)
    # returns 404 on Render, so crawlers and AdSense see nothing.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The service worker and the HTML shell decide which build everyone runs,
      # so they must never be served from a cache — not the browser's, not the
      # CDN's. Without this a deploy can sit behind a stale copy for minutes.
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      # Everything under /assets carries a content hash in its filename, so a
      # changed file is a changed URL and these can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
