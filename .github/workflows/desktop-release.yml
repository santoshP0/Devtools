name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest          # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest          # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # Bundle a static ffmpeg as a Tauri sidecar so users never install it.
      # Named per Rust target triple (Tauri strips the suffix at bundle time).
      # Redistributable GPL builds: macOS = martin-riedl.de, Win/Linux = BtbN.
      # See src-tauri/binaries/README.md for licensing.
      - name: Bundle ffmpeg (macOS Apple Silicon, GPL)
        if: contains(matrix.args, 'aarch64-apple-darwin')
        run: |
          mkdir -p src-tauri/binaries tmp-ff
          curl -L -o tmp-ff/arm.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip
          unzip -o -j tmp-ff/arm.zip ffmpeg -d tmp-ff
          mv tmp-ff/ffmpeg src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          codesign --force -s - src-tauri/binaries/ffmpeg-aarch64-apple-darwin

      - name: Bundle ffmpeg (macOS Intel, GPL)
        if: contains(matrix.args, 'x86_64-apple-darwin')
        run: |
          mkdir -p src-tauri/binaries tmp-ff
          curl -L -o tmp-ff/x64.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffmpeg.zip
          unzip -o -j tmp-ff/x64.zip ffmpeg -d tmp-ff
          mv tmp-ff/ffmpeg src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          codesign --force -s - src-tauri/binaries/ffmpeg-x86_64-apple-darwin

      - name: Bundle ffmpeg (macOS Universal, GPL)
        if: contains(matrix.args, 'universal-apple-darwin')
        run: |
          mkdir -p src-tauri/binaries tmp-ff/arm tmp-ff/x64
          curl -L -o tmp-ff/arm.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip
          curl -L -o tmp-ff/x64.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffmpeg.zip
          unzip -o -j tmp-ff/arm.zip ffmpeg -d tmp-ff/arm
          unzip -o -j tmp-ff/x64.zip ffmpeg -d tmp-ff/x64
          lipo -create tmp-ff/arm/ffmpeg tmp-ff/x64/ffmpeg -output src-tauri/binaries/ffmpeg-universal-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-universal-apple-darwin
          codesign --force -s - src-tauri/binaries/ffmpeg-universal-apple-darwin

      - name: Bundle ffmpeg (Linux, GPL)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/binaries
          curl -L -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf /tmp/ff.tar.xz -C /tmp
          cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu

      - name: Bundle ffmpeg (Windows, GPL)
        if: matrix.platform == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile $env:TEMP\ff.zip
          Expand-Archive -Path $env:TEMP\ff.zip -DestinationPath $env:TEMP\ff -Force
          $exe = (Get-ChildItem -Recurse -Path $env:TEMP\ff -Filter ffmpeg.exe | Select-Object -First 1).FullName
          Copy-Item $exe -Destination src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the updater artifacts + generates latest.json (see About/auto-update)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DevToolbox ${{ github.ref_name }}'
          releaseBody: ''
          releaseDraft: false
          args: ${{ matrix.args }}

  # Compose the final release notes from WHATS_NEW.txt in the tagged commit.
  # Runs after all builds so it wins over the fallback body above.
  notes:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          {
            if [ -s WHATS_NEW.txt ]; then
              cat WHATS_NEW.txt
            else
              echo "## What's changed"
              echo "- Maintenance and improvements"
            fi
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
