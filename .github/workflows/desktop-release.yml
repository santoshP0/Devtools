name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DevToolbox ${{ github.ref_name }}'
          releaseBody: |
            Download for your OS below: **.dmg** (macOS), **.msi/.exe** (Windows), **.AppImage/.deb** (Linux).

            ### 🍎 macOS: "Apple could not verify DevToolbox"
            The app isn't notarized by Apple yet, so macOS blocks it the first time. To allow it:
            1. Drag **DevToolbox** into **Applications** and double-click it.
            2. On the "could not verify" dialog, click **Done**.
            3. Open **System Settings → Privacy & Security**.
            4. Scroll down and click **Open Anyway** next to DevToolbox.
            5. Click **Open Anyway** again and enter your Mac password.

            Prefer Terminal? Run: `xattr -dr com.apple.quarantine /Applications/DevToolbox.app`
          releaseDraft: false
          args: ${{ matrix.args }}
